name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Синтаксис игры и тестов
        run: |
          node --check tests/scenario-test.js
          node --check tests/headless-test.js
          node --check tests/race-test.js
          node --check tests/screenshot-test.js

      - name: Симуляция без DOM (60 секунд игры)
        run: node tests/headless-test.js

      - name: Сценарии (удары, обгоны, барьер, трафик, нитро)
        run: node tests/scenario-test.js

      - name: Гонка (соперники, круги, трамплин, дрифт, финиш)
        run: node tests/race-test.js
