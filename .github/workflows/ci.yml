name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Сборка одного файла
        run: python3 tools/build.py

      - name: Синтаксис собранной игры
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          js = re.search(r'<script>\n(.*)\n</script>', html, re.S).group(1)
          pathlib.Path('/tmp/game.js').write_text(js, encoding='utf-8')
          print('JS извлечён:', len(js.splitlines()), 'строк')
          PY
          node --check /tmp/game.js

      - name: Геометрия мира (без браузера)
        run: node tools/world-stats.js

      - name: Синтаксис тестов
        run: node --check tests/world-test.js
